<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>行きたい店リスト App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>行きたい店リスト App</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="todo-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- TODO入力エリア -->
      <form id="todo-form" class="input-area">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="行きたい店の名前を入力..."
          maxlength="100"
          autocomplete="off"
        />
        <input type="text" id="todo-comment" class="todo-input" placeholder"メモ" maxlength="200" autocomplete="off" />
        <button type="submit" class="todo-button">追加</button>
      </form>

      <!-- TODOリスト -->
      <ul id="shop-list" class="todo-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 行きたい店リスト App</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
